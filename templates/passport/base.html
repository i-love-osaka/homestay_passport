{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{% static 'favicon/favicon.ico' %}" sizes="any">
<link rel="icon" href="{% static 'favicon/favicon-32x32.png' %}" type="image/png" sizes="32x32">
<link rel="icon" href="{% static 'favicon/favicon-16x16.png' %}" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="{% static 'favicon/apple-touch-icon.png' %}" sizes="180x180">
<link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">{% block styles %}{% endblock %}
<title>{{ title }}</title>
<style>
.banner{margin-bottom:20px;width:100%;aspect-ratio:5/1;background:url({% static 'img/passport/banner.png' %}) center/cover no-repeat;border:1px solid #dee2e6;border-radius:16px 16px 0 0}  {% block extra_css %}{% endblock %}
@media (max-width:768px){
    .banner{margin-bottom: 10px}
}
</style>
</head>
<body class="bg-light">
<div id="overlayAlert" class="overlay-alert d-none">
    <div class="overlay-bg"></div>
    <div class="overlay-content">
        <div id="overlayAlertBox" class="alert text-center shadow-lg"></div>
    </div>
</div>
<div class="container py-5" style="max-width:900px">
    <div class="banner"></div>
    <div class="card shadow-sm">
        {% block body %}{% endblock %}
    </div>
</div>{% block scripts %}{% endblock %}
</body>
</html>
